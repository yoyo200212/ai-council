<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0a0a14">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="三合一 AI">
    <title>三合一 AI 專家決策集團</title>
    <link rel="manifest" href="#" id="manifest-link">
    <style>
        :root {
            --bg-deep: #05050f;
            --bg-card: #0d0d1f;
            --bg-card2: #111128;
            --neon-blue: #00c8ff;
            --neon-purple: #b44fff;
            --neon-green: #00ff9d;
            --neon-gold: #ffd700;
            --neon-red: #ff4466;
            --neon-orange: #ff8c00;
            --primary: #e8e8f8;
            --secondary: #8888aa;
            --glow: rgba(0, 200, 255, 0.25);
            --mono: 'SF Mono', 'Fira Code', 'Courier New', monospace;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-deep);
            color: var(--primary);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            overflow-x: hidden;
            background-image: 
                radial-gradient(at 10% 10%, rgba(26, 21, 44, 0.6) 0px, transparent 50%),
                radial-gradient(at 90% 90%, rgba(15, 28, 41, 0.6) 0px, transparent 50%);
            background-attachment: fixed;
            padding-bottom: 20px;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 18px 20px;
            background: rgba(13, 13, 31, 0.75);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo {
            font-size: 1.25rem;
            font-weight: 800;
            display: flex;
            align-items: center;
            gap: 8px;
            letter-spacing: 1px;
            background: linear-gradient(135deg, var(--neon-blue), var(--neon-purple));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 20px rgba(0, 200, 255, 0.2);
        }

        .btn-icon {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: var(--primary);
            width: 40px;
            height: 40px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .btn-icon:active {
            transform: scale(0.92);
            background: rgba(255, 255, 255, 0.15);
        }

        nav {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 6px;
            padding: 12px;
            background: rgba(8, 8, 20, 0.5);
            border-bottom: 1px solid rgba(255, 255, 255, 0.03);
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            padding: 12px 4px;
            background: var(--bg-card);
            border: 1px solid rgba(255, 255, 255, 0.04);
            border-radius: 14px;
            color: var(--secondary);
            font-size: 0.78rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.25s ease;
        }

        .nav-item.active {
            color: var(--primary);
            background: linear-gradient(145deg, #121230, #0d0d1f);
            border-color: rgba(0, 200, 255, 0.4);
            box-shadow: 0 4px 20px rgba(0, 200, 255, 0.1);
        }

        .container {
            padding: 16px;
            max-width: 600px;
            margin: 0 auto;
        }

        .card {
            background: var(--bg-card);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 20px;
            padding: 16px;
            margin-bottom: 16px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
        }

        .status-banner {
            display: flex;
            align-items: center;
            gap: 10px;
            background: rgba(255, 255, 255, 0.03);
            padding: 12px 16px;
            border-radius: 14px;
            font-size: 0.85rem;
            color: var(--secondary);
            border: 1px solid rgba(255, 255, 255, 0.03);
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: var(--neon-green);
            box-shadow: 0 0 10px var(--neon-green);
        }

        .team-intro {
            background: linear-gradient(135deg, rgba(255, 215, 0, 0.06), rgba(255, 140, 0, 0.02));
            border: 1px solid rgba(255, 215, 0, 0.15);
            border-radius: 16px;
            padding: 14px 16px;
            margin: 16px 0;
            font-size: 0.9rem;
            line-height: 1.6;
            color: #f0e6d2;
        }

        .chat-container {
            display: flex;
            flex-direction: column;
            gap: 14px;
            min-height: 250px;
            max-height: 55vh;
            overflow-y: auto;
            padding-right: 4px;
            margin-bottom: 16px;
        }

        .chat-container::-webkit-scrollbar {
            width: 4px;
        }

        .chat-container::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 4px;
        }

        .msg {
            max-width: 88%;
            padding: 12px 16px;
            border-radius: 18px;
            font-size: 0.95rem;
            line-height: 1.5;
            word-wrap: break-word;
            animation: fadeIn 0.3s ease forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .msg.user {
            align-self: flex-end;
            background: linear-gradient(135deg, #1e1e45, #151535);
            color: var(--primary);
            border-bottom-right-radius: 4px;
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .msg.ai {
            align-self: flex-start;
            background: var(--bg-card2);
            color: #e0e0f0;
            border-bottom-left-radius: 4px;
            border: 1px solid rgba(255, 255, 255, 0.04);
        }

        .msg.ai-boss { border-left: 3px solid var(--neon-gold); }
        .msg.ai-stock { border-left: 3px solid var(--neon-red); }
        .msg.ai-career { border-left: 3px solid var(--neon-blue); }
        .msg.ai-life { border-left: 3px solid var(--neon-purple); }

        .msg.error {
            align-self: center;
            background: rgba(255, 68, 102, 0.08);
            border: 1px solid rgba(255, 68, 102, 0.2);
            color: #ff8899;
            font-size: 0.85rem;
            border-radius: 12px;
            max-width: 100%;
        }

        .input-area {
            display: flex;
            gap: 10px;
            align-items: center;
            position: relative;
        }

        .input-box {
            flex: 1;
            background: var(--bg-card2);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 16px;
            padding: 14px 16px;
            color: var(--primary);
            font-size: 0.95rem;
            outline: none;
            transition: all 0.25s ease;
        }

        .input-box:focus {
            border-color: rgba(0, 200, 255, 0.5);
            box-shadow: 0 0 15px rgba(0, 200, 255, 0.1);
        }

        .btn-send {
            background: linear-gradient(135deg, var(--neon-blue), var(--neon-purple));
            border: none;
            color: white;
            width: 48px;
            height: 48px;
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(180, 79, 255, 0.25);
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .btn-send:active {
            transform: scale(0.9);
            box-shadow: 0 2px 6px rgba(180, 79, 255, 0.15);
        }

        .btn-send svg {
            width: 20px;
            height: 20px;
            fill: currentColor;
            transform: translateX(1px);
        }

        .setting-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(5, 5, 15, 0.85);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            z-index: 200;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0; pointer-events: none;
            transition: opacity 0.3s ease;
            padding: 20px;
        }

        .setting-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal {
            background: var(--bg-card);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 24px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.6);
            transform: scale(0.9);
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .setting-overlay.active .modal {
            transform: scale(1);
        }

        .modal-title {
            font-size: 1.15rem;
            font-weight: 700;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .setting-group {
            margin-bottom: 20px;
        }

        .setting-label {
            display: block;
            font-size: 0.85rem;
            color: var(--secondary);
            margin-bottom: 8px;
            font-weight: 600;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--neon-blue), var(--neon-purple));
            color: white;
            border: none;
            padding: 14px;
            border-radius: 14px;
            width: 100%;
            font-weight: 700;
            font-size: 0.95rem;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,200,255,0.2);
            transition: all 0.2s ease;
        }

        .btn-primary:active {
            transform: scale(0.96);
        }

        .preset-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin-bottom: 16px;
        }

        .preset-btn {
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.06);
            color: var(--primary);
            padding: 12px;
            border-radius: 12px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            text-align: center;
            transition: all 0.2s ease;
        }

        .preset-btn:active {
            background: rgba(255,255,255,0.08);
            border-color: rgba(255,255,255,0.2);
        }

        .markdown-content p {
            margin-bottom: 8px;
        }
        .markdown-content p:last-child {
            margin-bottom: 0;
        }
        .markdown-content strong {
            color: var(--neon-gold);
            font-weight: 700;
        }
        .markdown-content ul, .markdown-content ol {
            padding-left: 20px;
            margin-bottom: 8px;
        }
        .markdown-content li {
            margin-bottom: 4px;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">

        </div>
        <button class="btn-icon" id="btn-open-settings" aria-label="設定">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>

    <nav>
        <div class="nav-item active" data-panel="boss">

        <div class="nav-item" data-panel="stock">

    <div class="container">
        <div class="card" style="box-shadow: none; background: transparent; padding: 0; margin-bottom: 12px;">
            <div class="status-banner">
                <div class="status-dot"></div>
                <span id="status-text">決策總結團長 — 已就緒</span>
            </div>
        </div>

        <div class="team-intro" id="panel-intro">
            👑 <strong>決策總結團長</strong><br>
            歡迎來到核心決策室！我是集團總指揮。如果你有極其複雜、需要多角度論證的難題，可以直接交給我。我會召集旗下「股票、職涯、人生」三位頂尖顧問進行交叉會審，為你產出最全面的終極戰略報告。👇
        </div>

        <div class="card" style="margin-bottom: 12px;">
            <div class="chat-container" id="chat-box">

            <div class="input-area">

    <!-- 設定彈窗 -->
    <div class="setting-overlay" id="settings-modal">
        <div class="modal">
            <div class="modal-title">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>

    <script>
        // 核心設定與引導詞配置
        const CONFIG = {
            boss: {
                name: "決策總結團長",
                intro: "👑 <strong>決策總結團長</strong><br>歡迎來到核心決策室！我是集團總指揮。如果你有極其複雜、需要多角度論證的難題，可以直接交給我。我會召集旗下「股票、職涯、人生」三位頂尖顧問進行交叉會審，為你產出最全面的終極戰略報告。👇",
                prompt: "你是『三合一 AI 專家決策集團』的最高總指揮官。你的任務是站在最高維度，綜合分析用戶的問題。你旗下有三位頂尖顧問：股票投資專家、職涯發展導師、人生決策大師。在回答時，你必須先模擬這三位專家針對該問題的獨特觀點與交鋒意見，最後由你一槌定音，給出一個融合三方智慧、極具執行力的終極複合式大戰略報告。請用精煉、權威且極具啟發性的語氣回答，多用粗體建立結構。",
                presets: ["綜合審查：30歲全面資產與人生規劃", "高風險決策：該創業還是繼續留任？"]
            },
            stock: {
                name: "股票投資專家",
                intro: "📈 <strong>股票投資專家</strong><br>我是精準計量的操盤手。不談玄學、不講感覺，只看數據、指標、趨勢與籌碼。無論是總體經濟、短線技術面操作還是長期價值投資佈局，把你的資產配置交給我，讓我幫你找出勝率最高的獲利方程式。👇",
                prompt: "你是『三合一 AI 專家決策集團』中的頂尖股票投資專家、首席操盤手。你只相信數據、技術指標（如KD、MACD、RSI）、籌碼面、基本面以及總體經濟趨勢。你的回答必須極度敏銳、精準、充滿市場銅臭味與專業計量感。請直接切入核心利弊，給出具體的停損停利思維、風險報酬比評估與資產配置建議。多用粗體與條列式。",
                presets: ["台股萬八，該短線空倉還是定期定額？", "KD指標低於20，是黃金買點還是落第飛刀？"]
            },
            career: {
                name: "職涯發展導師",
                intro: "💼 <strong>職涯發展導師</strong><br>我是你的職場外掛與軍師。從商戰局勢、跳槽談判、副業變現到中年危機的轉型佈局，我都瞭若指掌。職場不只靠努力，更靠認知與策略。讓我幫你重新定位，拿回職涯主導權。👇",
                prompt: "你是『三合一 AI 專家決策集團』中的權威職涯發展導師。你精通麥肯錫思維、職場商戰政治學、個人品牌變現與副業轉型佈局。你的語氣犀利、直擊痛點、充滿江湖經驗且絕對務實。不要給心靈雞湯，要給具體跳槽策略、談判籌碼建立、技能樹點法與認知升級指南。多用粗體與條列式。",
                presets: ["面試大廠進入最後一輪，談薪水有何商戰策略？", "三十歲遇到職業瓶頸，該轉管理職還是精進技術？"]
            },
            life: {
                name: "人生決策大師",
                intro: "🧠 <strong>人生決策大師</strong><br>歡迎使用人生決策分析室！\n\n婚姻、移民、買房、教育規劃... 人生重大決策讓我幫您釐清思路。\n\n不要猶豫，把您的困惑告訴我們 👇",
                prompt: "你是『三合一 AI 專家決策集團』中的人生決策大師。你融合了哲學、心理學、賽局理論與長線幸福指數。你的任務是幫助用戶在面對人生十字路口（如買房、結婚、移民、留學）時，撥開情緒迷霧。你說話沉穩、溫柔、充滿穿透本質的智慧，善於用賽局框架來拆解人生選擇題，幫用戶釐清什麼是『不可逆的核心機會成本』。多用粗體與條列式。",
                presets: ["我想要不要移民去日本？", "買房背房貸 30 年，會不會摧毀我的人生自由？"]
            }
        };

        let currentRole = 'boss';
        let apiKey = localStorage.getItem('gemini_api_key') || '';

        // DOM 節點
        const chatBox = document.getElementById('chat-box');
        const userInput = document.getElementById('user-input');
        const btnSend = document.getElementById('btn-send');
        const btnOpenSettings = document.getElementById('btn-open-settings');
        const btnSaveSettings = document.getElementById('btn-save-settings');
        const apiKeyInput = document.getElementById('api-key-input');
        const settingsModal = document.getElementById('settings-modal');
        const statusText = document.getElementById('status-text');
        const panelIntro = document.getElementById('panel-intro');
        const presetContainer = document.getElementById('preset-container');

        // 初始化
        function init() {
            if (apiKey) apiKeyInput.value = apiKey;
            switchRole('boss');
            setupPWA();
        }

        // PWA 功能支援
        function setupPWA() {
            const manifest = {
                "name": "三合一 AI 專家決策集團",
                "short_name": "三合一 AI",
                "start_url": window.location.href,
                "display": "standalone",
                "background_color": "#05050f",
                "theme_color": "#0a0a14",
                "icons": [{
                    "src": "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%2300c8ff'><path d='M13 2L3 14h9l-1 8 10-12h-9l1-8z'/></svg>",
                    "sizes": "512x512",
                    "type": "image/svg+xml"
                }]
            };
            document.getElementById('manifest-link').setAttribute('href', 'data:application/json;base64,' + btoa(JSON.stringify(manifest)));
        }

        // 切換專家角色
        function switchRole(role) {
            currentRole = role;
            document.querySelectorAll('.nav-item').forEach(item => {
                item.classList.toggle('active', item.dataset.panel === role);
            });
            
            statusText.innerText = `${CONFIG[role].name} — 已就緒`;
            panelIntro.innerHTML = CONFIG[role].intro;
            
            // 渲染預設快捷按鈕
            presetContainer.innerHTML = '';
            CONFIG[role].presets.forEach(text => {
                const btn = document.createElement('div');
                btn.className = 'preset-btn';
                btn.innerText = text;
                btn.onclick = () => {
                    userInput.value = text;
                    sendMessage();
                };
                presetContainer.appendChild(btn);
            });

            // 清空當前對話
            chatBox.innerHTML = '';
            appendMsg(`🤖 ${CONFIG[role].name} 已連線。請描述您的核心困境或點擊上方快捷，我將為您提供深度剖析。`, 'ai ' + 'ai-' + role);
        }

        // 綁定導覽列點擊
        document.querySelectorAll('.nav-item').forEach(item => {
            item.onclick = () => switchRole(item.dataset.panel);
        });

        // 彈窗開關
        btnOpenSettings.onclick = () => settingsModal.classList.add('active');
        settingsModal.onclick = (e) => { if(e.target === settingsModal) settingsModal.classList.remove('active'); };
        btnSaveSettings.onclick = () => {
            const key = apiKeyInput.value.trim();
            if(!key) { alert('請輸入有效的 API Key'); return; }
            localStorage.setItem('gemini_api_key', key);
            apiKey = key;
            settingsModal.classList.remove('active');
        };

        // 附加對話訊息
        function appendMsg(text, type) {
            const msg = document.createElement('div');
            msg.className = `msg ${type}`;
            
            if (type.includes('ai')) {
                msg.classList.add('markdown-content');
                msg.innerHTML = parseMarkdown(text);
            } else {
                msg.innerText = text;
            }
            
            chatBox.appendChild(msg);
            chatBox.scrollTop = chatBox.scrollHeight;
            return msg;
        }

        // 極簡 Markdown 解析器
        function parseMarkdown(text) {
            let html = text
                .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
                .replace(/\*(.*?)\*/g, '<em>$1</em>')
                .replace(/`([^`]+)`/g, '<code style="background:rgba(255,255,255,0.1); padding:2px 4px; border-radius:4px; font-family:var(--mono);">$1</code>');
            
            const lines = html.split('\n');
            let result = '';
            let inList = false;
            
            lines.forEach(line => {
                const trimmed = line.trim();
                if (trimmed.startsWith('* ') || trimmed.startsWith('- ')) {
                    if (!inList) { result += '<ul>'; inList = true; }
                    result += `<li>${trimmed.substring(2)}</li>`;
                } else if (/^\d+\.\s/.test(trimmed)) {
                    if (!inList) { result += '<ol>'; inList = true; }
                    const content = trimmed.replace(/^\d+\.\s/, '');
                    result += `<li>${content}</li>`;
                } else {
                    if (inList) { result += inList.includes('<ul>') ? '</ul>' : '</ol>'; inList = false; }
                    if (trimmed) result += `<p>${line}</p>`;
                }
            });
            if (inList) result += '</ul>';
            return result;
        }

        // 發送訊息與呼叫 Gemini 核心 API
        async function sendMessage() {
            const text = userInput.value.trim();
            if(!text) return;
            
            if(!apiKey) {
                settingsModal.classList.add('active');
                return;
            }

            appendMsg(text, 'user');
            userInput.value = '';

            const loadingMsg = appendMsg('⚡ 集團思維運算中...', 'ai ai-' + currentRole);
            
            // 建立相容舊版結構與新版端點的 Payload，將系統引導詞直接合併到對話內容中
            const systemPrompt = CONFIG[currentRole].prompt;
            const payload = {
                contents: [{
                    parts: [{
                        text: `${systemPrompt}\n\n以下是用戶目前需要您評估與解答的問題：\n${text}`
                    }]
                }]
            };

            try {
                // 使用支援度最高、功能正常的正式 v1 管道
                const response = await fetch(`https://generativelanguage.googleapis.com/v1/models/gemini-1.5-flash:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                const data = await response.json();
                
                if(!response.ok) {
                    throw new Error(data.error?.message || `HTTP 錯誤代碼 ${response.status}`);
                }

                const aiReply = data.candidates?.[0]?.content?.parts?.[0]?.text || '⚠️ 集團內部通訊中斷，未傳回有效決策。';
                loadingMsg.innerHTML = parseMarkdown(aiReply);
                
            } catch (err) {
                console.error(err);
                loadingMsg.className = 'msg error';
                loadingMsg.innerHTML = `⚠️ 發生錯誤：${err.message}<br><br>請檢查 API Key 是否正確，或稍後再試。`;
            }
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        // 快捷鍵與發送點擊
        btnSend.onclick = sendMessage;
        userInput.onkeydown = (e) => { if(e.key === 'Enter') sendMessage(); };

        window.onload = init;
    </script>
</body>
</html>
